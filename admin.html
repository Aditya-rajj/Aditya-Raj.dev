<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Portfolio Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="admin.css?v=7">
</head>
<body>

<section id="login" class="login">
 <div class="lc">
  <div class="logo"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
  <h1>Manager</h1><p class="mut">Edit your portfolio from anywhere.</p>
  <label class="in"><i class="fa-regular fa-envelope"></i><input id="em" type="email" placeholder="Email" autocomplete="username"></label>
  <label class="in"><i class="fa-solid fa-lock"></i><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button type="button" id="eye" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></label>
  <button id="in" class="btn big">Sign in <i class="fa-solid fa-arrow-right"></i></button>
  <p id="err"></p>
 </div>
</section>

<div id="shell" hidden>
 <header class="top">
  <div class="brand"><i class="fa-solid fa-wand-magic-sparkles"></i><b>Manager</b></div>
  <span id="sync" class="sync ok"><i class="fa-solid fa-circle-check"></i><em>Published</em></span>
  <a class="ib" href="index.html" target="_blank" rel="noopener" aria-label="View site"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
  <button id="av" class="av" aria-label="Account menu"><i class="fa-solid fa-user"></i><img alt=""></button>
 </header>

 <div id="menu" class="menu" hidden>
  <div class="mh"><div class="av lg"><i class="fa-solid fa-user"></i><img alt=""></div><div><b>Signed in</b><small id="who"></small></div></div>
  <div class="ms"><span><i class="fa-solid fa-compress"></i> Image quality</span>
   <div class="seg" id="seg"><button type="button" data-q="small"><i class="fa-solid fa-feather"></i>Small</button><button type="button" data-q="balanced"><i class="fa-solid fa-sliders"></i>Balanced</button><button type="button" data-q="best"><i class="fa-solid fa-gem"></i>Best</button></div>
   <small>Photos are rotated, resized, stripped of location data and compressed to WebP in your browser before they are uploaded.</small></div>
  <button id="chk" type="button" class="mo"><i class="fa-solid fa-plug-circle-check"></i> Check site connection</button>
  <a class="mo" href="index.html" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a>
  <button id="out" type="button" class="mo danger"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
 </div>

 <main class="wrap"><div id="panels"></div></main>

 <div id="pubbar" class="pubbar" role="region" aria-label="Publish">
  <span class="dot"></span><span class="t">Unpublished changes</span>
  <button id="reset" type="button" class="ib sm" aria-label="Discard changes"><i class="fa-solid fa-rotate-left"></i></button>
  <button id="pub" type="button" class="btn"><i class="fa-solid fa-cloud-arrow-up"></i><span>Publish</span></button>
 </div>
 <nav id="nav" class="nav" aria-label="Sections"></nav>
</div>

<datalist id="dl"><option value="Work"><option value="Chat"><option value="Create"></datalist>
<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="cloud-config.js?v=7"></script>
<script src="cloud.js?v=7"></script>
<script src="admin.js?v=7"></script>
</body>
</html>
