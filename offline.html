<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Offline — Wi-Fi Left the Chat | Aditya Raj</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23d4ff3a'/%3E%3Ctext x='32' y='43' font-size='30' font-weight='700' text-anchor='middle' font-family='Arial' fill='%23000'%3EA%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body class="err-page">
  <div class="hglow" aria-hidden="true"></div>

  <main class="err-wrap">
    <div class="sys-card err-card">
      <div class="lab">
        <span>00 — Offline</span>
        <span class="sys-dot"><i></i>0 bars of hope</span>
      </div>

      <div class="sys-ic">
        <i class="fa-solid fa-wifi"></i>
        <b>/</b>
      </div>

      <h1 class="big">No <em>internet.</em></h1>

      <p class="sys-msg" id="off-msg">
        Your Wi-Fi just went out for milk and never came back. Even my code can’t fix your router—try paying the bill or aggressively toggling Airplane Mode.
      </p>

      <div class="sys-acts">
        <button type="button" class="cbtn" id="retry-btn">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Check connection</span>
        </button>
        <a class="pillb" href="index.html">
          <i class="fa-solid fa-house"></i>
          <span>Return to portfolio</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    const ROASTS = [
      "Still offline. Did the carrier pigeons go on strike?",
      "Nope, zero packets. Have you tried staring angrily at the router?",
      "Still nothing. Turning Airplane Mode on and off is free, just saying.",
      "404: Your ISP’s effort not found. Give it another second.",
      "Even smoke signals have better ping than your connection right now."
    ];
    let rIdx = 0;
    const btn = document.getElementById('retry-btn');
    const msg = document.getElementById('off-msg');

    btn.onclick = () => {
      if (navigator.onLine) {
        location.href = 'index.html';
        return;
      }
      msg.style.opacity = '0';
      setTimeout(() => {
        msg.textContent = ROASTS[rIdx++ % ROASTS.length];
        msg.style.opacity = '1';
      }, 150);
    };

    window.addEventListener('online', () => {
      location.href = 'index.html';
    });
  </script>
</body>
</html>
